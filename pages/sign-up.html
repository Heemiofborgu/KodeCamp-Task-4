<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up to get started</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <form class="mx-auto rounded bg-light w-50 mt-5 p-5">
        <div class="row">
            <div class="col">
                <input type="text" class="form-control mb-3" placeholder="First name" aria-label="First name">
            </div>
            <div class="col">
                <input type="text" class="form-control" placeholder="Last name" aria-label="Last name">
            </div>
        </div>
        <div class="row">
            <div class="col">
                <input type="email" class="form-control mb-3" placeholder="Email adress..." aria-label="email">
            </div>
            <div class="col">
                <input type="password" class="form-control" placeholder="Password" aria-label="Last name">
            </div>
        </div>
        <div class="col-12">
            <div class="form-check">
            <input class="form-check-input mb-3" type="radio" id="gridCheck">
            <label class="form-check-label" for="gridCheck">
                Accept terms and conditions
            </label>
            </div>
        </div>
        <div class="col-12 mb-3">
            <button type="submit" class="btn btn-primary">Sign in</button>
        </div>
        <div class="row">
            <div class="col">
                <p>Already have an account? <a href="/pages/sign-in.html" class="btn btn-outline-secondary">Sign In</a></p>
            </div>
        </div>
         <p>Click <a href="../index.html">here </a>to go back to home page</p>
    </form>
</body>
</html>
